<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shellbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #1c1c1e);
      color: var(--tg-theme-text-color, #fff);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      min-height: 100vh;
    }
    h1 { font-size: 20px; text-align: center; font-weight: 600; }
    .sub { font-size: 13px; text-align: center; color: var(--tg-theme-hint-color, #8e8e93); margin-bottom: 8px; }
    .card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color, #2c2c2e);
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
    .name { font-size: 22px; font-weight: 700; }
    .status { margin-left: auto; text-align: right; }
    .status-label { font-size: 13px; font-weight: 600; }
    .minutes { font-size: 12px; color: var(--tg-theme-hint-color, #8e8e93); }
    .updated { font-size: 12px; text-align: center; color: var(--tg-theme-hint-color, #8e8e93); margin-top: 8px; }
    .note {
      display: none;
      font-size: 13px;
      text-align: center;
      color: var(--tg-theme-hint-color, #8e8e93);
    }
  </style>
</head>
<body>
  <h1>⚡️ Shellbot</h1>
  <div class="sub">EV charging stations</div>
  <div id="cards"></div>
  <div class="updated" id="updated"></div>
  <div class="note" id="note">No station data — open this from the bot's ⌁ Stations menu button.</div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const STATUSES = {
      A: { label: "Available", color: "#34c759" },
      C: { label: "Charging", color: "#ff9f0a" },
      O: { label: "Completed · occupied", color: "#ff453a" },
      U: { label: "Unavailable", color: "#8e8e93" },
      N: { label: "Connected", color: "#5e5ce6" },
      X: { label: "Unknown", color: "#8e8e93" }
    };

    const app = window.Telegram && window.Telegram.WebApp;
    if (app) {
      app.ready();
      app.expand();
    }

    function payload() {
      const params = new URLSearchParams(window.location.search);
      let data = params.get("d");
      if (!data && app && app.initDataUnsafe && app.initDataUnsafe.start_param) {
        data = app.initDataUnsafe.start_param;
      }
      return data || "";
    }

    function render() {
      const data = payload();
      if (!data) {
        document.getElementById("note").style.display = "block";
        return;
      }
      const cards = document.getElementById("cards");
      const elements = [];
      for (const entry of data.split(",")) {
        const [name, letter, minutes] = entry.split("-");
        const status = STATUSES[letter] || STATUSES.X;
        const card = document.createElement("div");
        card.className = "card";
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.style.background = status.color;
        const nameEl = document.createElement("div");
        nameEl.className = "name";
        nameEl.textContent = name;
        const statusEl = document.createElement("div");
        statusEl.className = "status";
        const label = document.createElement("div");
        label.className = "status-label";
        label.style.color = status.color;
        label.textContent = status.label;
        const mins = document.createElement("div");
        mins.className = "minutes";
        mins.textContent = (minutes || 0) + "m";
        statusEl.append(label, mins);
        card.append(dot, nameEl, statusEl);
        elements.push(card);
      }
      cards.replaceChildren(...elements);
      const ts = new URLSearchParams(window.location.search).get("t");
      if (ts) {
        const when = new Date(parseInt(ts, 10) * 1000);
        document.getElementById("updated").textContent =
          "Updated " + when.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }
    }

    render();
    if (app) {
      app.onEvent("themeChanged", render);
    }
  </script>
</body>
</html>
